services:
  fg-cw-backend:
    build: .
    ports:
      - "${CW_PORT:-3101}:3101"
    depends_on:
      floci:
        condition: service_healthy
      mongo-ready:
        condition: service_healthy
      mongodb:
        condition: service_started
      entra:
        condition: service_healthy
    env_file:
      - ".env"
    environment:
      MONGO_URI: mongodb://mongodb:27017/?replicaSet=mongoRepl
      OIDC_JWKS_URI: http://entra:3010/jwks
      AWS_ENDPOINT_URL: http://floci:4566
      # Queue URLs name the host the SDK calls, so inside a container they must
      # point at floci rather than the localhost URLs in .env.
      CW__SQS__CREATE_NEW_CASE_URL: http://floci:4566/000000000000/cw__sqs__create_new_case_fifo.fifo
      CW__SQS__UPDATE_STATUS_URL: http://floci:4566/000000000000/cw__sqs__update_status_fifo.fifo
      CW__SQS__CONFIG_VERSION_QUEUE_URL: http://floci:4566/000000000000/cw__sqs__config_version_updated
      SERVICE_ACCESS_TOKEN_HASH: "${SERVICE_ACCESS_TOKEN_HASH:-}"
    networks:
      - cdp-tenant
    develop:
      watch:
        - path: src/
          target: /home/node/src
          action: sync+restart
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./migrate-mongo-config.js:/home/node/migrate-mongo-config.js
      - ./migrations:/home/node/migrations
      - ./package.json:/home/node/package.json
