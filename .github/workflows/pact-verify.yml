name: Pact Provider Verification

on:
  workflow_call:
    inputs:
      publish-verification:
        type: boolean
        default: false

jobs:
  pact:
    name: Verify Pacts
    runs-on: self-hosted

    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::$PACT_USER"
          echo "::add-mask::$PACT_PASS"

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch latest tags
        run: git fetch --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # A broker webhook does not say which pact changed, so both providers
      # are verified every time.
      - name: Run provider contract tests
        env:
          PACT_BROKER_BASE_URL: https://ffc-pact-broker.azure.defra.cloud
          PACT_PUBLISH_VERIFICATION: ${{ inputs.publish-verification }}
        run: |
          npm run test:contract -- test/contract/provider.gas-backend.test.js

      # The actuators pact is HTTP: it is replayed against the service and
      # Mongo started by the integration test harness, which reads .env.
      - name: Run actuators provider contract tests
        if: ${{ !cancelled() }}
        env:
          PACT_BROKER_BASE_URL: https://ffc-pact-broker.azure.defra.cloud
          PACT_PUBLISH_VERIFICATION: ${{ inputs.publish-verification }}
        run: |
          npm run setup:env
          npm run test:contract:actuators
