name: Create Pact Webhooks

on:
  workflow_dispatch:
    inputs:
      pair:
        description: "The consumer:provider pact to register a webhook for. A pair that already has one is skipped."
        type: choice
        options:
          - fg-gas-backend:fg-cw-backend-actuators
          - fg-gas-backend:fg-cw-backend
        default: fg-gas-backend:fg-cw-backend-actuators

jobs:
  create-webhooks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Mask secrets
        run: |
          echo "::add-mask::$PACT_USER"
          echo "::add-mask::$PACT_PASS"
          echo "::add-mask::$FFCPLATFORM_PAT"

      - name: Create Pact webhook
        env:
          PAIR: ${{ inputs.pair }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # ── Configuration ──────────────────────────────────────────────
          CONSUMER="${PAIR%%:*}"
          PROVIDER="${PAIR#*:}"
          TARGET_REPO="DEFRA/fg-cw-backend"
          # ───────────────────────────────────────────────────────────────

          PACT_BROKER_URL="https://ffc-pact-broker.azure.defra.cloud"
          AUTH_HEADER=$(printf '%s' "${PACT_USER}:${PACT_PASS}" | base64 | tr -d '\n')

          EXISTING=$(curl -sS --fail-with-body \
            -H "Authorization: Basic ${AUTH_HEADER}" \
            "${PACT_BROKER_URL}/webhooks/provider/${PROVIDER}/consumer/${CONSUMER}" |
            node -e 'let s = ""; process.stdin.on("data", (c) => (s += c)).on("end", () => console.log([].concat(JSON.parse(s)._links["pb:webhooks"] ?? []).length))')

          if [ "${EXISTING}" -gt 0 ]; then
            echo "A webhook for ${CONSUMER} -> ${PROVIDER} already exists - nothing to do"
            exit 0
          fi

          echo "Creating webhook for ${CONSUMER} -> ${PROVIDER}"

          curl -i -sS --fail-with-body -X POST "${PACT_BROKER_URL}/webhooks" \
            -H "Authorization: Basic ${AUTH_HEADER}" \
            -H "Content-Type: application/json" \
            --data-binary @- <<JSON
          {
            "description": "Trigger ${TARGET_REPO} workflow for ${CONSUMER} -> ${PROVIDER}",
            "consumer": {
              "name": "${CONSUMER}"
            },
            "provider": {
              "name": "${PROVIDER}"
            },
            "request": {
              "method": "POST",
              "url": "https://api.github.com/repos/${TARGET_REPO}/dispatches",
              "headers": {
                "accept": "application/vnd.github+json",
                "authorization": "Bearer ${FFCPLATFORM_PAT}",
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28"
              },
              "body": {
                "event_type": "pact_published",
                "client_payload": {
                  "pact_url": "\${pactbroker.pactUrl}",
                  "consumer": "\${pactbroker.consumerName}",
                  "provider": "\${pactbroker.providerName}",
                  "sha": "\${pactbroker.providerVersionNumber}",
                  "branch": "\${pactbroker.providerVersionBranch}",
                  "message": "Verify changed pact for \${pactbroker.consumerName} version \${pactbroker.consumerVersionNumber} branch \${pactbroker.consumerVersionBranch} by \${pactbroker.providerVersionNumber} (\${pactbroker.providerVersionDescriptions})"
                }
              }
            },
            "events": [
              {
                "name": "contract_requiring_verification_published"
              }
            ]
          }
          JSON
